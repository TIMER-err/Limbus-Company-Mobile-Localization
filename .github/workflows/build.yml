name: 构建汉化资源包

on:
  schedule:
    # GitHub 无法订阅其他仓库的 release 事件，只能轮询。
    # cron 用 UTC，以下对应 UTC+8 的 08:00 / 12:00 / 20:00。
    - cron: "0 0,4,12 * * *"
  # 供外部通知立即构建：gh api repos/:owner/:repo/dispatches -f event_type=upstream_update
  repository_dispatch:
    types: [upstream_update]
  workflow_dispatch:
    inputs:
      localize_tag:
        description: "汉化 Release tag（留空用 latest）"
        required: false
        default: ""
      force:
        description: "即使已有同名 Release 也重新构建"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: build-localization
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      localize_tag: ${{ steps.check.outputs.localize_tag }}
      game_version: ${{ steps.check.outputs.game_version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: 解析上游版本并判断是否需要构建
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          LOCALIZE_TAG: ${{ inputs.localize_tag || 'latest' }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          CHECK_ONLY=1 ./scripts/build.sh | tee resolve.log
          localize_tag=$(sed -n 's/^localize_tag=//p' resolve.log)
          game_version=$(sed -n 's/^game_version=//p' resolve.log)
          if [ -z "$localize_tag" ]; then
            echo "::error::未能解析上游版本"; exit 1
          fi
          # 不再以资源目录日期生成另一套名称；临时取不到版本时留给下次轮询重试。
          if [ -z "$game_version" ]; then
            echo "::error::未能从 XAPK 响应解析客户端版本号"; exit 1
          fi
          release_tag="v${game_version}-${localize_tag}"

          # Release 标签由「客户端版本 + 汉化版本」唯一确定；标签存在即表示该组合已构建。
          if gh release view "$release_tag" >/dev/null 2>&1; then
            release_exists=true
          else
            release_exists=false
          fi
          if [ "$FORCE" = "true" ]; then
            should_build=true
            reason="强制构建"
          elif [ "$release_exists" = "false" ]; then
            should_build=true
            reason="客户端版本或汉化版本有更新，尚无 Release $release_tag"
          else
            should_build=false
            reason="Release $release_tag 已覆盖当前客户端与汉化版本"
          fi

          {
            echo "localize_tag=$localize_tag"
            echo "game_version=$game_version"
            echo "release_tag=$release_tag"
            echo "should_build=$should_build"
          } >> "$GITHUB_OUTPUT"
          echo "### $reason" >> "$GITHUB_STEP_SUMMARY"
          printf '客户端版本：`%s`\n汉化文本：`%s`\n' \
            "$game_version" "$localize_tag" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 构建
        id: build
        env:
          LOCALIZE_TAG: ${{ needs.check.outputs.localize_tag }}
          EXPECTED_GAME_VERSION: ${{ needs.check.outputs.game_version }}
        run: |
          set -euo pipefail
          # 官方 CDN 偶发 TLS 握手失败，curl --retry 兜不住，这里整体重试。
          for attempt in 1 2 3; do
            if ./scripts/build.sh 2>&1 | tee build.log; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::构建连续 3 次失败"; exit 1
            fi
            echo "::warning::第 $attempt 次构建失败，30 秒后重试"
            sleep 30
          done
          patch_dir=$(sed -n 's/^patch_dir=//p' build.log | tail -1)
          if [ -z "$patch_dir" ]; then
            echo "::error::构建日志缺少官方资源版本"; exit 1
          fi
          echo "patch_dir=$patch_dir" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$(sha256sum dist/localize_jp.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(sha256sum dist/manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum localize_jp.zip manifest.json > checksums.sha256)

      - name: 汇总
        run: |
          {
            echo "### 构建结果"
            echo ""
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: localize-jp-${{ needs.check.outputs.release_tag }}
          path: |
            dist/localize_jp.zip
            dist/manifest.json
            dist/checksums.sha256
            build.log
          if-no-files-found: error
          retention-days: 14

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.release_tag }}
          name: ${{ needs.check.outputs.release_tag }}
          body: |
            官方资源版本：`${{ steps.build.outputs.patch_dir }}`
            汉化文本：[`${{ needs.check.outputs.localize_tag }}`](https://github.com/LocalizeLimbusCompany/LocalizeLimbusCompany/releases/tag/${{ needs.check.outputs.localize_tag }})

            ```
            ${{ steps.build.outputs.zip_sha256 }}  localize_jp.zip
            ${{ steps.build.outputs.manifest_sha256 }}  manifest.json
            ```
          files: |
            dist/localize_jp.zip
            dist/manifest.json
            dist/checksums.sha256
          fail_on_unmatched_files: true
