# 本服务只供本机游戏客户端访问；master 保持 root，worker 降权为 nobody。
user nobody;
worker_processes 1;

pid /data/local/nginx/logs/nginx.pid;
error_log /data/local/nginx/logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /data/local/nginx/conf/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log /data/local/nginx/logs/access.log;
    client_body_temp_path /data/local/nginx/temp/client_body;
    proxy_temp_path /data/local/nginx/temp/proxy;
    fastcgi_temp_path /data/local/nginx/temp/fastcgi;
    scgi_temp_path /data/local/nginx/temp/scgi;
    uwsgi_temp_path /data/local/nginx/temp/uwsgi;

    # 绕开本机 hosts 劫持，并在一个 Cloudflare 地址不可达时切换到另一个。
    upstream limbus_cdn {
        server 104.18.16.32:443 max_fails=2 fail_timeout=10s;
        server 104.18.17.32:443 max_fails=2 fail_timeout=10s;
        keepalive 4;
    }

    server {
        listen 127.0.0.1:443 ssl;
        server_name downloadcommon.limbuscompanycdn.org;

        ssl_certificate /data/local/nginx/ssl/ca.crt;
        ssl_certificate_key /data/local/nginx/ssl/ca.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location ~* /LocalizePatchInfo\.json$ {
            rewrite ^ /manifest.json break;
            root /data/local/nginx/html/Assets;
            default_type application/json;
        }

        location ~* /localize_jp\.zip$ {
            rewrite ^ /localize_jp.zip break;
            root /data/local/nginx/html/Assets;
            default_type application/zip;
        }

        location / {
            proxy_pass https://limbus_cdn;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_server_name on;
            proxy_ssl_name downloadcommon.limbuscompanycdn.org;
            proxy_ssl_verify off;

            proxy_set_header Host downloadcommon.limbuscompanycdn.org;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
        }
    }
}
